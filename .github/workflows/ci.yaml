name: CI Pipeline

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  lint:
    name: Lint Code 
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        namespace: [dev, staging, prod]
    environment: ${{ matrix.namespace }}
    continue-on-error: ${{ matrix.namespace != 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Check runner environment
        run: |
          echo "runner info:"
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -s)"
          echo "Workdir: $(pwd)"
        
      - name: Verify kubectl access
        run: |
          echo "Verify Kubernetes access..."
          kubectl version --client

      - name: Validate kustomize base
        continue-on-error: ${{ matrix.namespace != 'dev' }}
        run: |
          echo "Validating kustomize base..."
          kubectl kustomize k8n/base/ > /dev/null
          echo "Base kustomization OK!"

      - name: Validate overlay for ${{ matrix.namespace }}
        continue-on-error: ${{ matrix.namespace != 'dev' }}
        run: |
          echo "Validating overlay: ${{ matrix.namespace }}..."
          kubectl kustomize k8n/overlays/${{ matrix.namespace }} > /dev/null
          echo "Overlay ${{ matrix.namespace }} kustomization OK!"       
       
      - name: Success!
        run: |
          echo "¡All kustomize validations passed!!"    

  sonar:
    name: SonarQube Analysis with Coverage 
    runs-on: self-hosted
    needs: lint
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        namespace: [dev, staging, prod]
    environment: ${{ matrix.namespace }}
    env:
      SONAR_PROJECT_KEY: final-project-${{ matrix.namespace }}
      SONAR_PROJECT_NAME: final-project-${{ matrix.namespace }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SonarQube Analysis for YAML
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=final-project-${{ matrix.namespace }}
            -Dsonar.projectName=final-project-${{ matrix.namespace }}
            -Dsonar.sources=k8n/base,k8n/overlays/${{ matrix.namespace }}
            -Dsonar.inclusions=**/*.yaml,**/*.yml
            -Dsonar.exclusions=k8n/charts/**
            -Dsonar.qualitygate.wait=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Output Sonar Info
        run: |
          echo "Sonar analysis finished for ${{ matrix.namespace }}" 
