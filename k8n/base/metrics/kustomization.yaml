apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring
namePrefix: monitoring-


resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - daemonset_promtail.yaml
  - daemonset-node-exporter.yaml
  - service-node-exporter.yaml
  - rbac_promtail.yaml
  - rbac-prometheus.yaml



labels:
  - pairs:
      environment: monitoring
