apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonar
  template:
    metadata:
      labels:
        app: sonar
    spec:
      securityContext:
        fsGroup: 1000
      # Fixes issues with permissions on hostPath bindings
      #      initContainers:
      #        - name: fix-permissions
      #          image: busybox
      #          command: ["sh", "-c", "chmod -R 777 /opt/sonarqube && chown -R 1000:1000 /opt/sonarqube"]
      #          securityContext:
      #            privileged: true
      #          volumeMounts:
      #            - name: sonarqube-data
      #              mountPath: /opt/sonarqube
      containers:
        - name: sonar
          envFrom:
            - configMapRef:
                name: sonar-config
          resources:
            requests:
              memory: "1024Mi"
              cpu: "500m"
            limits:
              memory: "10240Mi"
              cpu: "4"
          image: sonarqube:latest
          ports:
            - containerPort: 9000


